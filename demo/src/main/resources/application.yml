spring:
  application:
    name: massivo

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 400MB
      max-request-size: 400MB

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:massivo}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:massivo}
    user: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:123456}

  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD:admin}

server:
  port: ${SERVER_PORT:8080}

aws:
  region: ${AWS_REGION:us-east-2}
  access-key: ${S3_KEY:test}
  secret-key: ${S3_SECRET:test}
  s3:
    bucket: ${S3_BUCKET:imports-bucket}
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
  sqs:
    endpoint: ${SQS_ENDPOINT:http://localhost:4566}
    import-queue-url: ${IMPORT_QUEUE_URL:http://localhost:4566/000000000000/import-jobs}

app:
  import:
    chunk-size: 10000
    error-threshold: 0.10
